<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>REJAS PERIMETRALES</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { font-family: Arial; margin: 20px; background: #f6f7fb; }
h2 { margin-bottom: 10px; }

.filters { margin-bottom: 15px; }

select, input {
  padding: 6px;
  margin-right: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  margin-top: 10px;
}

th {
  background: #f1f3f6;
  position: sticky;
  top: 0;
  padding: 10px;
}

td {
  padding: 8px;
  text-align: center;
  border-bottom: 1px solid #eee;
}

tr:hover { background: #eef5ff; cursor: pointer; }

a {
  color: #2d6cdf;
  text-decoration: none;
}

a:hover { text-decoration: underline; }

#map {
  height: 500px;
  margin-bottom: 20px;
  border-radius: 10px;
}

.pagination { margin-top: 10px; }

button {
  margin: 2px;
  padding: 5px 10px;
  cursor: pointer;
}

.section-buttons {
  margin-bottom: 15px;
}

.section-button {
  padding: 8px 16px;
  margin-right: 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: white;
  cursor: pointer;
}

.section-button.active {
  background: #2d6cdf;
  color: white;
  border-color: #2d6cdf;
}

#certificadoSection {
  display: none;
}

 .certificado-month-buttons {
  margin: 10px 0 18px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.certificado-month-button {
  padding: 7px 13px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: white;
  cursor: pointer;
}

.certificado-month-button.active {
  background: #2d6cdf;
  color: white;
  border-color: #2d6cdf;
}

.certificado-panel {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
}

.certificado-panel table {
  max-width: 900px;
}

.certificado-total {
  margin-top: 15px;
  font-weight: bold;
}

.certificado-grafico {
  margin-top: 25px;
  max-width: 900px;
}

.barra-zona {
  display: flex;
  align-items: center;
  margin: 9px 0;
  gap: 10px;
}

.barra-zona-label {
  width: 45px;
  font-weight: bold;
}

.barra-zona-fondo {
  flex: 1;
  height: 24px;
  background: #e9edf3;
  border-radius: 5px;
  overflow: hidden;
}

.barra-zona-valor {
  height: 100%;
  background: #2d6cdf;
  min-width: 1px;
}

.barra-zona-porcentaje {
  width: 90px;
  text-align: right;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>REJAS PERIMETRALES</h2>

<div class="section-buttons">
  <button class="section-button active" id="btnLimpiezas" onclick="mostrarSeccion('limpiezas')">Limpiezas</button>
  <button class="section-button" id="btnCertificado" onclick="mostrarSeccion('certificado')">Certificado</button>
</div>

<div id="limpiezasSection">
<h3>Elementos</h3>
<div id="map"></div>

<div class="filters">
  <label>Zona:</label>
  <select id="zonaFilter">
    <option value="TODAS">Todas</option>
  </select>

  <label>Mes:</label>
  <select id="mesFilter">
    <option value="TODOS">Todos</option>
  </select>

  <label>Buscar calle:</label>
  <input type="text" id="calleFilter" placeholder="Ej: Corrientes">

  <label>Buscar N°RP:</label>
  <input type="text" id="rpFilter" placeholder="Ej: RP-Z1-123">
</div>

<div id="table"></div>
<div class="pagination" id="pagination"></div>
</div>

<div id="certificadoSection">
  <h3>Certificado</h3>
  <div id="certificadoMonthButtons" class="certificado-month-buttons"></div>
  <div id="certificadoTable"></div>
</div>

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1hApdn-eXp8OYBdDuCO3KEUTuxaOGL4ANZ-PZdcaIAt0/export?format=csv&gid=0";

let dataGlobal = [];
let filteredData = [];
let currentPage = 1;
const pageSize = 100;

let map;
let markersLayer;
let markersByRP = {}; // 🔥 clave

// ================= HELPERS =================
function getCol(row, name) {
  let key = Object.keys(row).find(k =>
    k.trim().toUpperCase() === name.trim().toUpperCase()
  );
  return key ? row[key] : "";
}

// ================= LOAD =================
function loadData() {

  Papa.parse(SHEET_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {

      dataGlobal = results.data;

      fillZoneFilter();
      fillMonthFilter();
      filteredData = dataGlobal;

      initMap();
      renderTable();
      renderPagination();
      renderMap(filteredData);
    }
  });
}

// ================= ZONAS =================
function fillZoneFilter() {

  let select = document.getElementById("zonaFilter");

  let zonas = [...new Set(dataGlobal.map(r => r.Zona).filter(Boolean))];

  zonas.forEach(z => {
    let opt = document.createElement("option");
    opt.value = z;
    opt.textContent = z;
    select.appendChild(opt);
  });
}


function fillMonthFilter() {

  let select = document.getElementById("mesFilter");

  let meses = [...new Set(
    dataGlobal
      .map(row => {
        let fecha = getCol(row, "Fecha de limpieza");
        if (!fecha) return null;
        let partes = fecha.split("/");
        if (partes.length < 3) return null;
        return partes[1].padStart(2,"0") + "/" + partes[2];
      })
      .filter(Boolean)
  )];

  meses.sort((a,b) => {
    let [ma,ya] = a.split("/");
    let [mb,yb] = b.split("/");
    return new Date(yb,mb-1) - new Date(ya,ma-1);
  });

  const nombresMeses = [
    "Enero","Febrero","Marzo","Abril","Mayo","Junio",
    "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
  ];

  meses.forEach(m => {
    let [mes,anio] = m.split("/");
    let opt = document.createElement("option");
    opt.value = m;
    opt.textContent = nombresMeses[parseInt(mes)-1] + " " + anio;
    select.appendChild(opt);
  });
}

// ================= FILTER =================
function applyFilters() {

  let zona = document.getElementById("zonaFilter").value;
  let mes = document.getElementById("mesFilter").value;
  let calle = document.getElementById("calleFilter").value.toUpperCase();
  let rpSearch = document.getElementById("rpFilter").value.toUpperCase();

  filteredData = dataGlobal.filter(row => {

    let matchZona = (zona === "TODAS" || row.Zona === zona);

    let fecha = getCol(row, "Fecha de limpieza");

    let matchMes = true;

    if (mes !== "TODOS") {

      if (!fecha) {

        matchMes = false;

      } else {

        let partes = fecha.split("/");

        if (partes.length < 3) {

          matchMes = false;

        } else {

          let mesFila = partes[1].padStart(2,"0") + "/" + partes[2];

          matchMes = mesFila === mes;
        }
      }
    }

    let calleVal = getCol(row, "CALLE").toUpperCase();
    let matchCalle = !calle || calleVal.includes(calle);

    let rpVal = (getCol(row, "N°RP") || getCol(row, "RP")).toUpperCase();
    let matchRP = !rpSearch || rpVal.includes(rpSearch);

    return matchZona && matchMes && matchCalle && matchRP;
  });

  currentPage = 1;

  renderTable();
  renderPagination();
  renderMap(filteredData);
}

// ================= TABLE =================
function renderTable() {

  let start = (currentPage - 1) * pageSize;
  let pageData = filteredData.slice(start, start + pageSize);

  if (!pageData.length) {
    document.getElementById("table").innerHTML = "<p>No hay resultados</p>";
    return;
  }

  let hiddenCols = ["N°", "Observaciones", "C1", "C2"];
  let headers = Object.keys(pageData[0]).filter(h => !hiddenCols.includes(h));

  let html = "<table><tr>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";

  pageData.forEach(row => {

    let rp = getCol(row, "N°RP") || getCol(row, "RP") || "";

    html += `<tr onclick="irAMapa('${rp}')">`;

    headers.forEach(h => {

      let value = row[h] || "";

      if (h.toUpperCase().includes("FOTO") && value) {
        value = `<a href="${value}" target="_blank">Ver</a>`;
      }

      html += `<td>${value}</td>`;
    });

    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("table").innerHTML = html;
}

// ================= PAGINATION =================
function renderPagination() {

  let totalPages = Math.ceil(filteredData.length / pageSize);

  let html = "";

  for (let i = 1; i <= totalPages; i++) {
    html += `<button onclick="goPage(${i})">${i}</button>`;
  }

  document.getElementById("pagination").innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderTable();
}

// ================= MAP =================
function initMap() {

  map = L.map('map').setView([-34.6037, -58.3816], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  markersLayer = L.layerGroup().addTo(map);
}

function renderMap(data) {

  markersLayer.clearLayers();
  markersByRP = {}; // 🔥 reset

  data.forEach(row => {

    if (!row.C1) return;

    let coords = row.C1.split(",");
    let lat = parseFloat(coords[0]);
    let lng = parseFloat(coords[1]);

    if (isNaN(lat) || isNaN(lng)) return;

    let rp = getCol(row, "N°RP") || getCol(row, "RP") || "-";

    let popup = `
      <b>${rp}</b><br>
      ${row.Calle || ""}<br>
      <a href="${row.Foto || "#"}" target="_blank">Ver foto</a>
    `;

    let marker = L.circleMarker([lat, lng], {
      radius: 4,
      color: "#2d6cdf",
      weight: 1,
      fillOpacity: 0.8
    });

    marker.bindPopup(popup);

    markersLayer.addLayer(marker);

    // 🔥 guardar referencia
    markersByRP[rp] = marker;
  });

  if (markersLayer.getLayers().length > 0) {
    map.fitBounds(markersLayer.getBounds());
  }
}

// ================= INTERACCION =================
function irAMapa(rp) {

  let marker = markersByRP[rp];

  if (!marker) return;

  let latlng = marker.getLatLng();

  map.setView(latlng, 18); // 🔥 zoom fuerte
  marker.openPopup();
}

// ================= SECCIONES =================
function mostrarSeccion(seccion) {
  const limpiezas = document.getElementById("limpiezasSection");
  const certificado = document.getElementById("certificadoSection");
  const btnLimpiezas = document.getElementById("btnLimpiezas");
  const btnCertificado = document.getElementById("btnCertificado");

  if (seccion === "certificado") {
    limpiezas.style.display = "none";
    certificado.style.display = "block";
    btnLimpiezas.classList.remove("active");
    btnCertificado.classList.add("active");
    renderCertificado();
  } else {
    limpiezas.style.display = "block";
    certificado.style.display = "none";
    btnCertificado.classList.remove("active");
    btnLimpiezas.classList.add("active");
  }
}

// ================= CERTIFICADO =================
// Cuenta los valores de la columna L(m), agrupados por mes.
// El mes se obtiene de "Fecha de limpieza".
function renderCertificado() {
  const botones = document.getElementById("certificadoMonthButtons");
  const contenedor = document.getElementById("certificadoTable");

  if (!dataGlobal.length) {
    botones.innerHTML = "";
    contenedor.innerHTML = "<p>No hay datos disponibles.</p>";
    return;
  }

  const nombresMeses = [
    "Enero","Febrero","Marzo","Abril","Mayo","Junio",
    "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
  ];

  // Valores base para calcular el porcentaje certificado de cada zona.
  const objetivosZona = {
    "Z1": 8103,
    "Z2": 1127,
    "Z3": 3156,
    "Z4": 3839,
    "Z5": 581
  };

  // Acumula L(m) por mes y por zona.
  const porMesZona = {};

  dataGlobal.forEach(row => {
    const fecha = getCol(row, "Fecha de limpieza");
    const valorLM = getCol(row, "L(m)");
    const zona = String(getCol(row, "Zona") || "").trim().toUpperCase();

    if (!fecha || valorLM === "" || !objetivosZona[zona]) return;

    const partes = fecha.split("/");
    if (partes.length < 3) return;

    const mes = parseInt(partes[1], 10);
    const anio = partes[2];

    if (!mes || !anio) return;

    const clave = `${anio}-${String(mes).padStart(2, "0")}`;

    let valor = String(valorLM).trim().replace(/\s/g, "");

    if (valor.includes(",") && valor.includes(".")) {
      valor = valor.replace(/\./g, "").replace(",", ".");
    } else if (valor.includes(",")) {
      valor = valor.replace(",", ".");
    }

    const numero = parseFloat(valor);
    if (isNaN(numero)) return;

    if (!porMesZona[clave]) {
      porMesZona[clave] = {
        Z1: 0,
        Z2: 0,
        Z3: 0,
        Z4: 0,
        Z5: 0
      };
    }

    porMesZona[clave][zona] += numero;
  });

  const meses = Object.keys(porMesZona).sort((a, b) => b.localeCompare(a));

  if (!meses.length) {
    botones.innerHTML = "";
    contenedor.innerHTML =
      "<p>No se encontraron valores válidos de L(m) por zona.</p>";
    return;
  }

  // Crear botones de cada mes.
  botones.innerHTML = meses.map((clave, index) => {
    const [anio, mes] = clave.split("-");
    const nombre = nombresMeses[parseInt(mes, 10) - 1];

    return `
      <button
        class="certificado-month-button ${index === 0 ? "active" : ""}"
        onclick="mostrarCertificadoMes('${clave}', this)">
        ${nombre} ${anio}
      </button>
    `;
  }).join("");

  mostrarCertificadoMes(meses[0], botones.querySelector("button"));
}

function mostrarCertificadoMes(clave, boton) {
  document.querySelectorAll(".certificado-month-button").forEach(b => {
    b.classList.remove("active");
  });

  if (boton) boton.classList.add("active");

  const contenedor = document.getElementById("certificadoTable");

  const objetivosZona = {
    "Z1": 8103,
    "Z2": 1127,
    "Z3": 3156,
    "Z4": 3839,
    "Z5": 581
  };

  const nombresMeses = [
    "Enero","Febrero","Marzo","Abril","Mayo","Junio",
    "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
  ];

  // Volver a calcular el mes seleccionado para que el certificado
  // siempre use los datos actuales de la planilla.
  const acumulado = {
    Z1: 0,
    Z2: 0,
    Z3: 0,
    Z4: 0,
    Z5: 0
  };

  dataGlobal.forEach(row => {
    const fecha = getCol(row, "Fecha de limpieza");
    const valorLM = getCol(row, "L(m)");
    const zona = String(getCol(row, "Zona") || "").trim().toUpperCase();

    if (!fecha || valorLM === "" || !objetivosZona[zona]) return;

    const partes = fecha.split("/");
    if (partes.length < 3) return;

    const mes = partes[1].padStart(2, "0");
    const anio = partes[2];

    if (`${anio}-${mes}` !== clave) return;

    let valor = String(valorLM).trim().replace(/\s/g, "");

    if (valor.includes(",") && valor.includes(".")) {
      valor = valor.replace(/\./g, "").replace(",", ".");
    } else if (valor.includes(",")) {
      valor = valor.replace(",", ".");
    }

    const numero = parseFloat(valor);
    if (!isNaN(numero)) acumulado[zona] += numero;
  });

  const [anio, mes] = clave.split("-");
  const tituloMes = `${nombresMeses[parseInt(mes, 10) - 1]} ${anio}`;

  let totalMes = 0;

  let html = `
    <div class="certificado-panel">
      <h3>${tituloMes}</h3>

      <table>
        <tr>
          <th>Zona</th>
          <th>L(m) certificado</th>
          <th>Objetivo total zona</th>
          <th>% certificado</th>
        </tr>
  `;

  ["Z1", "Z2", "Z3", "Z4", "Z5"].forEach(zona => {
    const valor = acumulado[zona];
    const objetivo = objetivosZona[zona];
    const porcentaje = objetivo > 0 ? (valor / objetivo) * 100 : 0;

    totalMes += valor;

    html += `
      <tr>
        <td><strong>${zona}</strong></td>
        <td>${valor.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })}</td>
        <td>${objetivo.toLocaleString("es-AR")}</td>
        <td>${porcentaje.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })}%</td>
      </tr>
    `;
  });

  html += `
      </table>

      <div class="certificado-total">
        Total certificado del mes:
        ${totalMes.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })} L(m)
      </div>

      <div class="certificado-grafico">
        <h3>Porcentaje certificado por zona</h3>
  `;

  ["Z1", "Z2", "Z3", "Z4", "Z5"].forEach(zona => {
    const valor = acumulado[zona];
    const objetivo = objetivosZona[zona];
    const porcentaje = objetivo > 0 ? (valor / objetivo) * 100 : 0;

    // La barra puede superar 100% visualmente si el valor certificado
    // supera el objetivo total de la zona.
    const ancho = Math.min(porcentaje, 100);

    html += `
      <div class="barra-zona">
        <div class="barra-zona-label">${zona}</div>
        <div class="barra-zona-fondo">
          <div class="barra-zona-valor" style="width:${ancho}%"></div>
        </div>
        <div class="barra-zona-porcentaje">
          ${porcentaje.toLocaleString("es-AR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          })}%
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </div>
  `;

  contenedor.innerHTML = html;
}

// ================= EVENTS =================
document.getElementById("zonaFilter").addEventListener("change", applyFilters);
document.getElementById("mesFilter").addEventListener("change", applyFilters);
document.getElementById("calleFilter").addEventListener("input", applyFilters);
document.getElementById("rpFilter").addEventListener("input", applyFilters);

// ================= INIT =================
loadData();

</script>

</body>
</html>
