<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limpiezas RP</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #222;
  }

  header {
    background: #1f2937;
    color: white;
    padding: 18px 24px;
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: 26px;
  }

  header p {
    margin: 6px 0 0;
    opacity: .8;
    font-size: 14px;
  }

  .container {
    max-width: 1500px;
    margin: 22px auto;
    padding: 0 16px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  .tab {
    border: 0;
    padding: 12px 24px;
    border-radius: 9px;
    background: #d9dee5;
    color: #263241;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
  }

  .tab.active {
    background: #2563eb;
    color: white;
  }

  .panel {
    display: none;
  }

  .panel.active {
    display: block;
  }

  .filters {
    background: white;
    padding: 16px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 16px;
  }

  .filters-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(180px, 1fr));
    gap: 12px;
  }

  .filters-grid.cert {
    grid-template-columns: minmax(220px, 350px);
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
    color: #4b5563;
  }

  input, select {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    background: white;
    font-size: 14px;
  }

  .filter-actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }

  .btn-clear {
    border: 0;
    background: #6b7280;
    color: white;
    padding: 9px 15px;
    border-radius: 7px;
    cursor: pointer;
  }

  .info {
    background: white;
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    box-shadow: 0 1px 5px rgba(0,0,0,.06);
  }

  .table-wrap {
    background: white;
    border-radius: 10px;
    overflow: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 900px;
  }

  th {
    background: #1f2937;
    color: white;
    padding: 11px 10px;
    text-align: left;
    font-size: 13px;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  td {
    padding: 9px 10px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 13px;
    white-space: nowrap;
  }

  tbody tr:hover {
    background: #f3f7ff;
  }

  .zone {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 20px;
    background: #e5e7eb;
    font-weight: bold;
    font-size: 12px;
  }

  .summary-table th,
  .summary-table td {
    text-align: center;
  }

  .summary-table td:first-child,
  .summary-table th:first-child {
    text-align: left;
  }

  .month-title {
    margin: 0 0 12px;
    font-size: 19px;
  }

  .totals {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }

  .card {
    background: white;
    padding: 13px 17px;
    border-radius: 9px;
    box-shadow: 0 2px 7px rgba(0,0,0,.07);
    min-width: 145px;
  }

  .card .label {
    color: #6b7280;
    font-size: 12px;
  }

  .card .value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 3px;
  }

  .loading {
    padding: 35px;
    text-align: center;
    color: #6b7280;
  }

  .error {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 8px;
    line-height: 1.5;
  }

  @media (max-width: 750px) {
    .filters-grid,
    .filters-grid.cert {
      grid-template-columns: 1fr;
    }

    .tabs {
      flex-direction: column;
    }

    .tab {
      width: 100%;
    }
  }
</style>
</head>

<body>

<header>
  <h1>Limpiezas de Sumideros / RP</h1>
  <p>Datos actualizados directamente desde Google Sheets</p>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="showPanel('limpiezas', this)">Limpiezas</button>
    <button class="tab" onclick="showPanel('certificados', this)">Certificados</button>
  </div>

  <!-- =========================
       LIMPIEZAS
  ========================== -->
  <section id="limpiezas" class="panel active">

    <div class="filters">
      <div class="filters-grid">

        <div>
          <label for="fRP">N° RP</label>
          <input id="fRP" type="text" placeholder="Buscar N° RP..." oninput="renderLimpiezas()">
        </div>

        <div>
          <label for="fCalle">Calle</label>
          <input id="fCalle" type="text" placeholder="Buscar calle..." oninput="renderLimpiezas()">
        </div>

        <div>
          <label for="fZona">Zona</label>
          <select id="fZona" onchange="renderLimpiezas()">
            <option value="">Todas las zonas</option>
          </select>
        </div>

      </div>

      <div class="filter-actions">
        <button class="btn-clear" onclick="clearLimpiezaFilters()">Limpiar filtros</button>
      </div>
    </div>

    <div class="info" id="limpiezaInfo">Cargando...</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>N° RP</th>
            <th>Calle</th>
            <th>Altura</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Com.</th>
            <th>Zona</th>
            <th>L (m)</th>
          </tr>
        </thead>
        <tbody id="limpiezasBody">
          <tr><td colspan="9" class="loading">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>

  </section>

  <!-- =========================
       CERTIFICADOS
  ========================== -->
  <section id="certificados" class="panel">

    <div class="filters">
      <div class="filters-grid cert">
        <div>
          <label for="fMes">Mes</label>
          <select id="fMes" onchange="renderCertificados()">
            <option value="">Todos los meses</option>
          </select>
        </div>
      </div>

      <div class="filter-actions">
        <button class="btn-clear" onclick="document.getElementById('fMes').value=''; renderCertificados();">
          Mostrar todos
        </button>
      </div>
    </div>

    <div class="info" id="certInfo">Cargando...</div>

    <div class="totals" id="totals"></div>

    <div class="table-wrap">
      <table class="summary-table">
        <thead>
          <tr>
            <th>Mes</th>
            <th>Zona</th>
            <th>L (m)</th>
          </tr>
        </thead>
        <tbody id="certBody">
          <tr><td colspan="3" class="loading">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>

  </section>

</div>

<script>
/*
  Google Sheet:
  https://docs.google.com/spreadsheets/d/1hApdn-eXp8OYBdDuCO3KEUTuxaOGL4ANZ-PZdcaIAt0/edit?gid=0

  IMPORTANTE:
  La hoja debe estar compartida como "Cualquier persona con el enlace - Lector"
  para que el navegador pueda leerla mediante gviz.
*/

const SHEET_ID = '1hApdn-eXp8OYBdDuCO3KEUTuxaOGL4ANZ-PZdcaIAt0';
const GID = '0';

let datos = [];

// Columnas originales de la planilla:
// A fecha, B n°rp, C (no se usa), D calle, E altura,
// F inicio, G fin, H com, I zona, J l(m)

const IDX = {
  fecha: 0,
  rp: 1,
  calle: 3,
  altura: 4,
  inicio: 5,
  fin: 6,
  com: 7,
  zona: 8,
  longitud: 9
};

const MESES = [
  'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
  'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
];

function showPanel(id, button) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  button.classList.add('active');

  if (id === 'certificados') {
    renderCertificados();
  }
}

function normalizar(v) {
  return String(v ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function parseFecha(value) {
  if (value === null || value === undefined || value === '') return null;

  // Date serial de Google Sheets
  if (typeof value === 'number') {
    const d = new Date(Date.UTC(1899, 11, 30) + value * 86400000);
    if (!isNaN(d)) return d;
  }

  let s = String(value).trim();

  // dd/mm/yyyy o dd-mm-yyyy
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    let year = Number(m[3]);
    if (year < 100) year += 2000;
    const d = new Date(year, Number(m[2]) - 1, Number(m[1]));
    if (!isNaN(d)) return d;
  }

  // yyyy-mm-dd
  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) {
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    if (!isNaN(d)) return d;
  }

  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function formatoFecha(value) {
  const d = parseFecha(value);
  if (!d) return value || '';

  return String(d.getDate()).padStart(2, '0') + '/' +
         String(d.getMonth() + 1).padStart(2, '0') + '/' +
         d.getFullYear();
}

function numero(value) {
  if (value === null || value === undefined || value === '') return 0;

  let s = String(value).trim().replace(/\s/g, '');

  // Maneja tanto 1234,56 como 1.234,56 y 1234.56
  if (s.includes(',') && s.includes('.')) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  }

  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function formatoNumero(n) {
  return Number(n || 0).toLocaleString('es-AR', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  });
}

async function cargarDatos() {
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
    `?gid=${GID}&tqx=out:json`;

  try {
    const response = await fetch(url, { cache: 'no-store' });

    if (!response.ok) {
      throw new Error('No se pudo acceder a Google Sheets. Código HTTP ' + response.status);
    }

    const texto = await response.text();

    // gviz devuelve:
    // /*O_o*/ google.visualization.Query.setResponse({...});
    const inicio = texto.indexOf('{');
    const fin = texto.lastIndexOf('}');

    if (inicio === -1 || fin === -1) {
      throw new Error('Google Sheets no devolvió datos en formato válido.');
    }

    const json = JSON.parse(texto.substring(inicio, fin + 1));
    const filas = json.table?.rows || [];

    datos = filas.map(row =>
      (row.c || []).map(cell => cell ? cell.v : '')
    );

    cargarFiltros();
    renderLimpiezas();
    renderCertificados();

  } catch (error) {
    console.error(error);

    const mensaje = `
      <div class="error">
        <strong>No se pudieron cargar los datos.</strong><br><br>
        ${error.message}<br><br>
        Verificá que la planilla esté compartida como
        <strong>"Cualquier persona con el enlace - Lector"</strong>.
      </div>
    `;

    document.getElementById('limpiezaInfo').innerHTML = mensaje;
    document.getElementById('limpiezasBody').innerHTML =
      '<tr><td colspan="9" class="error">No se pudieron cargar los datos.</td></tr>';

    document.getElementById('certInfo').innerHTML = mensaje;
    document.getElementById('certBody').innerHTML =
      '<tr><td colspan="3" class="error">No se pudieron cargar los datos.</td></tr>';
  }
}

function cargarFiltros() {
  const zonas = [...new Set(
    datos
      .map(r => r[IDX.zona])
      .filter(v => v !== undefined && v !== null && String(v).trim() !== '')
      .map(v => String(v).trim())
  )];

  zonas.sort((a, b) =>
    String(a).localeCompare(String(b), 'es', { numeric: true })
  );

  const selectZona = document.getElementById('fZona');
  selectZona.innerHTML = '<option value="">Todas las zonas</option>';

  zonas.forEach(z => {
    const option = document.createElement('option');
    option.value = z;
    option.textContent = z;
    selectZona.appendChild(option);
  });

  const meses = new Set();

  datos.forEach(r => {
    const d = parseFecha(r[IDX.fecha]);
    if (d) {
      meses.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
    }
  });

  const selectMes = document.getElementById('fMes');
  selectMes.innerHTML = '<option value="">Todos los meses</option>';

  [...meses]
    .sort()
    .reverse()
    .forEach(key => {
      const [year, month] = key.split('-');
      const option = document.createElement('option');
      option.value = key;
      option.textContent = MESES[Number(month) - 1] + ' ' + year;
      selectMes.appendChild(option);
    });
}

function renderLimpiezas() {
  const rp = normalizar(document.getElementById('fRP').value);
  const calle = normalizar(document.getElementById('fCalle').value);
  const zona = document.getElementById('fZona').value;

  const filtrados = datos.filter(r => {
    const coincideRP =
      !rp || normalizar(r[IDX.rp]).includes(rp);

    const coincideCalle =
      !calle || normalizar(r[IDX.calle]).includes(calle);

    const coincideZona =
      !zona || String(r[IDX.zona]).trim() === zona;

    return coincideRP && coincideCalle && coincideZona;
  });

  const body = document.getElementById('limpiezasBody');

  if (!filtrados.length) {
    body.innerHTML =
      '<tr><td colspan="9" class="loading">No hay resultados para los filtros seleccionados.</td></tr>';
  } else {
    body.innerHTML = filtrados.map(r => `
      <tr>
        <td>${escapeHTML(formatoFecha(r[IDX.fecha]))}</td>
        <td>${escapeHTML(r[IDX.rp])}</td>
        <td>${escapeHTML(r[IDX.calle])}</td>
        <td>${escapeHTML(r[IDX.altura])}</td>
        <td>${escapeHTML(r[IDX.inicio])}</td>
        <td>${escapeHTML(r[IDX.fin])}</td>
        <td>${escapeHTML(r[IDX.com])}</td>
        <td><span class="zone">${escapeHTML(r[IDX.zona])}</span></td>
        <td>${escapeHTML(r[IDX.longitud])}</td>
      </tr>
    `).join('');
  }

  document.getElementById('limpiezaInfo').textContent =
    `Mostrando ${filtrados.length.toLocaleString('es-AR')} de ${datos.length.toLocaleString('es-AR')} registros.`;
}

function clearLimpiezaFilters() {
  document.getElementById('fRP').value = '';
  document.getElementById('fCalle').value = '';
  document.getElementById('fZona').value = '';
  renderLimpiezas();
}

function renderCertificados() {
  const filtroMes = document.getElementById('fMes').value;

  const grupos = {};

  datos.forEach(r => {
    const d = parseFecha(r[IDX.fecha]);
    if (!d) return;

    const key =
      `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

    if (filtroMes && key !== filtroMes) return;

    if (!grupos[key]) {
      grupos[key] = {
        fecha: d,
        zonas: {}
      };
    }

    const zona = String(r[IDX.zona] ?? '').trim() || 'Sin zona';

    if (!grupos[key].zonas[zona]) {
      grupos[key].zonas[zona] = {
        cantidad: 0,
        metros: 0
      };
    }

    grupos[key].zonas[zona].cantidad++;
    grupos[key].zonas[zona].metros += numero(r[IDX.longitud]);
  });

  const ordenados = Object.keys(grupos).sort();

  const body = document.getElementById('certBody');

  if (!ordenados.length) {
    body.innerHTML =
      '<tr><td colspan="3" class="loading">No hay datos para el mes seleccionado.</td></tr>';
    document.getElementById('certInfo').textContent = 'Sin resultados.';
    document.getElementById('totals').innerHTML = '';
    return;
  }

  let totalLimpiezas = 0;
  let totalMetros = 0;

  const zonasTotales = {
    '1': { cantidad: 0, metros: 0 },
    '2': { cantidad: 0, metros: 0 },
    '3': { cantidad: 0, metros: 0 },
    '4': { cantidad: 0, metros: 0 },
    '5': { cantidad: 0, metros: 0 }
  };

  let filas = '';

  ordenados.forEach(key => {
    const grupo = grupos[key];
    const d = grupo.fecha;
    const nombreMes = MESES[d.getMonth()] + ' ' + d.getFullYear();

    for (let z = 1; z <= 5; z++) {
      const info = buscarZona(grupo.zonas, z);

      filas += `
        <tr>
          <td>${nombreMes}</td>
          <td><strong>${z}</strong></td>
          <td>${formatoNumero(info.metros)}</td>
        </tr>
      `;

      totalLimpiezas += info.cantidad;
      totalMetros += info.metros;

      zonasTotales[String(z)].cantidad += info.cantidad;
      zonasTotales[String(z)].metros += info.metros;
    }
  });

  body.innerHTML = filas;

  document.getElementById('certInfo').textContent =
    filtroMes
      ? `Resumen correspondiente a ${formatearClaveMes(filtroMes)}.`
      : `Resumen de ${ordenados.length} meses disponibles.`;

  document.getElementById('totals').innerHTML = `
    <div class="card">
      <div class="label">Total limpiezas</div>
      <div class="value">${formatoNumero(totalLimpiezas)}</div>
    </div>

    <div class="card">
      <div class="label">Total L (m)</div>
      <div class="value">${formatoNumero(totalMetros)}</div>
    </div>

    ${[1,2,3,4,5].map(z => `
      <div class="card">
        <div class="label">Zona ${z}</div>
        <div class="value">${formatoNumero(zonasTotales[String(z)].metros)} m</div>
        <div style="font-size:12px;color:#6b7280;margin-top:3px;">
          ${formatoNumero(zonasTotales[String(z)].cantidad)} limpiezas
        </div>
      </div>
    `).join('')}
  `;
}

function buscarZona(zonas, numeroZona) {
  const posibles = [
    String(numeroZona),
    'Z' + numeroZona,
    'Zona ' + numeroZona,
    'ZONA ' + numeroZona,
    'zona ' + numeroZona
  ];

  for (const clave of posibles) {
    if (zonas[clave]) return zonas[clave];
  }

  // Comparación normalizada para variantes de escritura
  const objetivo = normalizar(String(numeroZona));

  for (const [clave, valor] of Object.entries(zonas)) {
    const n = normalizar(clave).replace('zona', '').replace('z', '').trim();
    if (n === objetivo) return valor;
  }

  return { cantidad: 0, metros: 0 };
}

function formatearClaveMes(key) {
  const [year, month] = key.split('-');
  return MESES[Number(month) - 1] + ' ' + year;
}

function escapeHTML(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

cargarDatos();
</script>

</body>
</html>
